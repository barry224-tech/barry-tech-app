
name: Build Barry Tech

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q Barry_Tech_sources_corrige.zip -d extracted
          FILE=$(find extracted -name pubspec.yaml -print -quit)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Generate Android platform
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Configure Android SDK 36
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app")
          files = list(app.glob("build.gradle")) + list(app.glob("build.gradle.kts"))
          if not files:
              raise SystemExit("Gradle Android introuvable")

          found = False
          for file in files:
              text = file.read_text()
              patterns = [
                  (r'compileSdkVersion\s+flutter\.compileSdkVersion',
                   'compileSdkVersion 36'),
                  (r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                   'compileSdk = 36'),
                  (r'compileSdk\s+flutter\.compileSdkVersion',
                   'compileSdk 36'),
              ]
              for pattern, replacement in patterns:
                  text, count = re.subn(pattern, replacement, text)
                  found = found or count > 0
              file.write_text(text)

          if not found:
              raise SystemExit("Impossible de modifier compileSdk")

          print("Android compileSdk configuré à 36")
          PY

      - name: Verify Android SDK
        run: |
          cd "$PROJECT_DIR"
          grep -R -n -E 'compileSdk(Version)?[ =]+36' android/app

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Barry-Tech-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive Barry_Tech_sources_corrige.zip extracted
          $file = Get-ChildItem extracted -Filter pubspec.yaml -Recurse | Select-Object -First 1
          if (-not $file) { throw "pubspec.yaml introuvable" }
          "PROJECT_DIR=$($file.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Generate Windows platform
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          flutter create --platforms=windows .

      - name: Build Windows
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          flutter pub get
          flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          $dir = Join-Path $env:PROJECT_DIR 'build/windows/x64/runner/Release'
          if (-not (Test-Path $dir)) { throw "Release introuvable" }
          Compress-Archive -Path "$dir/*" -DestinationPath Barry-Tech-Windows.zip -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Barry-Tech-Windows
          path: Barry-Tech-Windows.zip
          if-no-files-found: error
