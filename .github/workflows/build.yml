
name: Build Barry Tech

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract corrected source
        run: |
          mkdir -p extracted
          unzip -q Barry_Tech_sources_corrige.zip -d extracted
          FILE=$(find extracted -name pubspec.yaml -print -quit)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Generate Android files
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.barrytech .

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Barry-Tech-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract corrected source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath Barry_Tech_sources_corrige.zip -DestinationPath extracted -Force
          $file = Get-ChildItem extracted -Filter pubspec.yaml -Recurse | Select-Object -First 1
          if (-not $file) { throw 'pubspec.yaml not found' }
          "PROJECT_DIR=$($file.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Generate Windows files
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          flutter create --platforms=windows --org com.barrytech .

      - name: Build Windows
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          flutter pub get
          flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          $dir = Join-Path $env:PROJECT_DIR 'build/windows/x64/runner/Release'
          if (-not (Test-Path $dir)) { throw 'Release folder not found' }
          Compress-Archive -Path "$dir/*" -DestinationPath Barry-Tech-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Barry-Tech-Windows
          path: Barry-Tech-Windows.zip
          if-no-files-found: error
