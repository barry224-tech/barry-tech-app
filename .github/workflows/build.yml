
name: Build Barry Tech

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q Barry_Tech_sources_corrige.zip -d extracted
          PROJECT_FILE=$(find extracted -name pubspec.yaml -print -quit)
          test -n "$PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android platform
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .
      
      - name: Set Android SDK 36
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app")
          files = list(app.glob("build.gradle")) + list(app.glob("build.gradle.kts"))
          if not files:
              raise SystemExit("Fichier Gradle Android introuvable")

          for file in files:
              text = file.read_text()
              text = re.sub(
                  r'compileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion 36',
                  text
              )
              text = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36',
                  text
              )
              text = re.sub(
                  r'compileSdk\s+flutter\.compileSdkVersion',
                  'compileSdk 36',
                  text
              )
              file.write_text(text)

          if not any(re.search(r'compileSdk(?:Version)?\s*(?:=)?\s*36\b', f.read_text()) for f in files):
              raise SystemExit("ERREUR : SDK 36 non appliqué")
          print("SDK 36 vérifié.")
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Barry-Tech-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive Barry_Tech_sources_corrige.zip extracted
          $project = Get-ChildItem extracted -Filter pubspec.yaml -Recurse | Select-Object -First 1
          if ($null -eq $project) { throw "pubspec.yaml introuvable" }
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Generate Windows platform
        shell: pwsh
        run: |
          cd $env:PROJECT_DIR
          flutter create --platforms=windows .

      - name: Build Windows
        shell: pwsh
        run: |
          cd $env:PROJECT_DIR
          flutter pub get
          flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Barry-Tech-Windows
          path: ${{ env.PROJECT_DIR }}/build/windows/x64/runner/Release/
